name: Run Llama Test
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/llama-test.yml'

jobs:
  run-llama:
    runs-on: ubuntu-latest
    steps:
      - name: استنساخ llama.cpp
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp

      - name: تخزين مؤقت لملفات البناء
        uses: actions/cache@v4
        with:
          path: llama.cpp/build
          key: llama-build-${{ runner.os }}-${{ hashFiles('llama.cpp/CMakeLists.txt') }}
          restore-keys: |
            llama-build-${{ runner.os }}-

      - name: بناء llama.cpp من المصدر
        run: |
          cd llama.cpp
          cmake -B build -DLLAMA_CURL=OFF
          cmake --build build --config Release -j$(nproc) --target llama-cli
          ls -la build/bin/

      - name: تخزين مؤقت لملف النموذج
        uses: actions/cache@v4
        id: cache-model
        with:
          path: model.gguf
          key: llama-3.2-1b-q4km

      - name: تحميل نموذج Llama 3.2 1B مكمّم
        if: steps.cache-model.outputs.cache-hit != 'true'
        run: |
          curl -f -L -o model.gguf \
          https://huggingface.co/bartowski/Llama-3.2-1B-Instruct-GGUF/resolve/main/Llama-3.2-1B-Instruct-Q4_K_M.gguf

      - name: تشغيل النموذج
        timeout-minutes: 3
        run: |
          timeout --kill-after=10 30 ./llama.cpp/build/bin/llama-cli -m model.gguf \
          -p "اكتب جملة ترحيبية قصيرة" -n 100 -no-cnv < /dev/null
